---
path: "<<run_path>>"
work_path: "<<work_path>>"
logging:
  project: nf2
  name: "Cartesian automatic disambiguation"
data:
  geometry: cartesian
  batch_size: 2048
  normalization:
    Mm_per_ds: 100
    Gauss_per_dB: 1000
  boundaries:
    - id: auto_disambiguation_boundary
      type: los_trv_azi
      Mm_per_pixel: 0.36
      files:
        B_los: "<<B_los>>"
        B_trv: "<<B_trv>>"
        B_azi: "<<B_azi>>"
      ambiguous_azimuth: true
      load_map: false
  sampler:
    type: height
    batch_size: 4096
  potential_boundary:
    id: potential
    type: potential
    strides: 4
  validation:
    - id: auto_disambiguation_boundary
      type: los_trv_azi
      Mm_per_pixel: 0.36
      files:
        B_los: "<<B_los>>"
        B_trv: "<<B_trv>>"
        B_azi: "<<B_azi>>"
      ambiguous_azimuth: true
      load_map: false
    - id: cube
      type: cube
    - id: slices
      type: slices
  iterations: 10000
  z_range: <<z_range;[0, 100]>>
training:
  epochs: 15
model:
  field: vector_potential
losses:
  - type: boundary_los_trv_azi
    name: auto_disambiguation_boundary
    weight: 1.0
    datasets: [auto_disambiguation_boundary]
    ambiguous: true
  - type: boundary
    name: potential_boundary
    weight: 1.0
    datasets: potential
  - type: force_free
    name: force_free
    weight:
      type: exponential
      start: 1.0e-5
      end: <<force_free_weight;1.0e-3>>
      iterations: 30000
    datasets: [random]
loss_scaling:
  - type: b_height
    name: b_height
    loss_ids: [force_free]
    power: 2
    detach: true
callbacks:
  - type: los_trv_azi_boundary
    dataset: auto_disambiguation_boundary
  - type: metrics
    dataset: cube
  - type: slices
    dataset: slices
